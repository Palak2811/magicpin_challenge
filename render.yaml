services:
  - type: web
    name: vera-bot
    runtime: python
    plan: starter          # always-on; free tier sleeps and would wipe in-memory state
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Keep "none" for the judged submission: the challenge rejects "unstable responses" and requires
      # deterministic output; an LLM (esp. a rate-limited free key) makes wording vary between runs.
      - key: LLM_PROVIDER      # gemini | openai | anthropic | none (default: none = pure rules)
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL         # optional, e.g. gemini-2.5-flash
        sync: false
